<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>熊猫敲鼓节拍器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0e0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      width: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0d0d1a 0%, #1a1a3e 50%, #16132b 100%);
    }

    #spine-canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .controls {
      position: relative;
      width: 100%;
      padding: 20px 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .play-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #playBtn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e0a040;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #playBtn:hover {
      background: #f0b050;
    }

    #playBtn:active {
      transform: scale(0.95);
    }

    .bpm-control {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bpm-label {
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #bpmSlider {
      width: 200px;
      accent-color: #e0a040;
      cursor: pointer;
    }

    #bpmInput {
      width: 60px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      padding: 4px;
      font-family: inherit;
    }

    #bpmInput:focus {
      outline: none;
      border-color: #e0a040;
    }

    #beatIndicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #333;
      transition: background 0.05s, box-shadow 0.05s;
      flex-shrink: 0;
    }

    #beatIndicator.active {
      background: #e0a040;
      box-shadow: 0 0 20px #e0a040, 0 0 40px rgba(224, 160, 64, 0.3);
    }

    /* ==================== Responsive Adaptation ==================== */

    @media (max-width: 480px) and (orientation: portrait) {
      .controls {
        flex-direction: column;
        gap: 14px;
        padding: 14px 16px;
      }

      #playBtn {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }

      #beatIndicator {
        width: 14px;
        height: 14px;
      }

      .bpm-control {
        width: 100%;
        justify-content: center;
      }

      #bpmSlider {
        width: 140px;
      }

      #bpmInput {
        width: 54px;
        font-size: 16px;
      }

      .bpm-label {
        font-size: 12px;
      }
    }

    @media (max-height: 480px) and (orientation: landscape) {
      .controls {
        padding: 8px 20px;
        gap: 16px;
      }

      #playBtn {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      #beatIndicator {
        width: 12px;
        height: 12px;
      }

      #bpmSlider {
        width: 120px;
      }

      #bpmInput {
        width: 52px;
        font-size: 15px;
        padding: 2px;
      }

      .bpm-label {
        font-size: 11px;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) and (orientation: portrait) {
      .controls {
        padding: 16px 24px;
        gap: 20px;
      }

      #bpmSlider {
        width: 160px;
      }
    }

    @media (min-width: 481px) and (max-width: 1024px) and (orientation: landscape) {
      .controls {
        padding: 12px 24px;
        gap: 20px;
      }

      #bpmSlider {
        width: 180px;
      }
    }

    @media (max-height: 360px) {
      .controls {
        padding: 6px 12px;
        gap: 12px;
      }

      #playBtn {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }

      #beatIndicator {
        width: 10px;
        height: 10px;
      }

      #bpmSlider {
        width: 100px;
      }

      #bpmInput {
        width: 48px;
        font-size: 14px;
        padding: 2px;
      }

      .bpm-label {
        font-size: 10px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      #playBtn {
        min-width: 44px;
        min-height: 44px;
      }

      #bpmSlider {
        height: 24px;
      }

      #bpmInput {
        min-height: 36px;
        font-size: max(16px, 1em);
      }
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .controls {
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        padding-left: calc(16px + env(safe-area-inset-left));
        padding-right: calc(16px + env(safe-area-inset-right));
      }
    }

    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-size: 18px;
      color: #888;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="loading-text" id="loadingText">加载动画中...</div>
  </div>

  <div id="canvas-container">
    <canvas id="spine-canvas"></canvas>
  </div>

  <div class="controls">
    <div class="play-group">
      <button id="playBtn">&#9654;</button>
      <div id="beatIndicator"></div>
    </div>
    <div class="bpm-control">
      <span class="bpm-label">BPM</span>
      <input type="range" id="bpmSlider" min="40" max="208" value="120">
      <input type="number" id="bpmInput" min="40" max="208" value="120">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/EsotericSoftware/spine-runtimes@3.8/spine-ts/build/spine-canvas.js"></script>
  <script>
    // ==================== Audio Engine ====================
    var audioCtx = null;
    var noiseBuffer = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
        var bufferSize = Math.floor(audioCtx.sampleRate * 0.02);
        noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        var data = noiseBuffer.getChannelData(0);
        for (var i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.3;
        }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playWoodblock(time) {
      var ctx = ensureAudioCtx();
      var t = time || ctx.currentTime;

      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(800, t);
      osc1.frequency.exponentialRampToValueAtTime(400, t + 0.08);
      gain1.gain.setValueAtTime(0.6, t);
      gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc1.connect(gain1).connect(ctx.destination);
      osc1.start(t);
      osc1.stop(t + 0.1);

      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2400, t);
      osc2.frequency.exponentialRampToValueAtTime(1200, t + 0.04);
      gain2.gain.setValueAtTime(0.3, t);
      gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(t);
      osc2.stop(t + 0.06);

      var noise = ctx.createBufferSource();
      var noiseGain = ctx.createGain();
      noise.buffer = noiseBuffer;
      noiseGain.gain.setValueAtTime(0.4, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.01);
      noise.connect(noiseGain).connect(ctx.destination);
      noise.start(t);
      noise.stop(t + 0.02);
    }

    // ==================== Beat Scheduler ====================
    var isPlaying = false;
    var bpm = 120;
    var nextBeatTime = 0;
    var schedulerTimer = null;

    var SCHEDULE_AHEAD = 0.1;
    var SCHEDULER_INTERVAL = 25;

    function getBeatInterval() {
      return 60.0 / bpm;
    }

    function scheduleBeat(beatTime) {
      var ctx = ensureAudioCtx();
      playWoodblock(beatTime);

      var delay = (beatTime - ctx.currentTime) * 1000;
      setTimeout(function() {
        var indicator = document.getElementById('beatIndicator');
        indicator.classList.add('active');
        setTimeout(function() { indicator.classList.remove('active'); }, 100);
      }, Math.max(0, delay));
    }

    function scheduler() {
      if (!isPlaying) return;
      var ctx = ensureAudioCtx();
      while (nextBeatTime < ctx.currentTime + SCHEDULE_AHEAD) {
        scheduleBeat(nextBeatTime);
        nextBeatTime += getBeatInterval();
      }
      schedulerTimer = setTimeout(scheduler, SCHEDULER_INTERVAL);
    }

    function startMetronome() {
      var ctx = ensureAudioCtx();
      isPlaying = true;
      nextBeatTime = ctx.currentTime;
      scheduler();
      document.getElementById('playBtn').innerHTML = '&#9724;';
      startSpineSync();
    }

    function stopMetronome() {
      isPlaying = false;
      if (schedulerTimer !== null) {
        clearTimeout(schedulerTimer);
        schedulerTimer = null;
      }
      document.getElementById('playBtn').innerHTML = '&#9654;';
      document.getElementById('beatIndicator').classList.remove('active');
      stopSpineSync();
    }

    // ==================== UI Wiring ====================
    var playBtn = document.getElementById('playBtn');
    var bpmSlider = document.getElementById('bpmSlider');
    var bpmInput = document.getElementById('bpmInput');

    playBtn.addEventListener('click', function() {
      if (isPlaying) {
        stopMetronome();
      } else {
        startMetronome();
      }
    });

    bpmSlider.addEventListener('input', function(e) {
      bpm = parseInt(e.target.value);
      bpmInput.value = bpm;
      if (isPlaying) resyncSpine();
    });

    bpmInput.addEventListener('change', function(e) {
      var val = parseInt(e.target.value);
      if (isNaN(val)) val = 120;
      val = Math.max(40, Math.min(208, val));
      bpm = val;
      bpmSlider.value = bpm;
      bpmInput.value = bpm;
      if (isPlaying) resyncSpine();
    });

    // ==================== Spine Animation ====================
    var canvas = document.getElementById('spine-canvas');
    var context = canvas.getContext('2d');
    var skeletonRenderer = new spine.canvas.SkeletonRenderer(context);
    // Enable triangle rendering for mesh attachments
    skeletonRenderer.triangleRendering = true;

    var skeleton = null;
    var animState = null;
    var animBounds = null;
    var SPINE_ANIM_DURATION = 0.8; // animation duration in seconds
    var SPINE_BEATS_PER_LOOP = 2;  // 2 drum hits per animation loop

    // Load Spine assets
    var assetManager = new spine.canvas.AssetManager();
    assetManager.loadText('panda/panda.json');
    assetManager.loadText('panda/panda.atlas');
    assetManager.loadTexture('panda/panda.png');

    function waitForAssets() {
      if (assetManager.isLoadingComplete()) {
        if (assetManager.hasErrors()) {
          document.getElementById('loadingText').textContent = '加载失败';
          console.error(assetManager.getErrors());
          return;
        }
        initSpine();
      } else {
        requestAnimationFrame(waitForAssets);
      }
    }
    requestAnimationFrame(waitForAssets);

    function initSpine() {
      // Create atlas with texture lookup — disable premultiplied alpha
      var atlasText = assetManager.get('panda/panda.atlas');
      var atlas = new spine.TextureAtlas(atlasText, function(path) {
        return assetManager.get('panda/' + path);
      });

      var atlasLoader = new spine.AtlasAttachmentLoader(atlas);
      var skeletonJson = new spine.SkeletonJson(atlasLoader);
      // Patch version to bypass 3.8.75 blocklist in spine-canvas runtime
      var skeletonJsonData = JSON.parse(assetManager.get('panda/panda.json'));
      if (skeletonJsonData.skeleton && skeletonJsonData.skeleton.spine === '3.8.75') {
        skeletonJsonData.skeleton.spine = '3.8.99';
      }
      var skeletonData = skeletonJson.readSkeletonData(skeletonJsonData);

      skeleton = new spine.Skeleton(skeletonData);
      skeleton.scaleY = -1; // Canvas 2D Y-axis is flipped vs Spine
      skeleton.setToSetupPose();
      skeleton.updateWorldTransform();

      // Calculate bounds
      var offset = new spine.Vector2();
      var size = new spine.Vector2();
      skeleton.getBounds(offset, size, []);
      animBounds = { offset: offset, size: size };

      // Animation state
      var stateData = new spine.AnimationStateData(skeletonData);
      animState = new spine.AnimationState(stateData);
      animState.setAnimation(0, 'animation', true);

      // Get actual animation duration
      var animations = skeletonData.animations;
      for (var i = 0; i < animations.length; i++) {
        if (animations[i].name === 'animation') {
          SPINE_ANIM_DURATION = animations[i].duration;
          break;
        }
      }

      // Hide loading overlay
      var overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('hidden');
      setTimeout(function() { overlay.style.display = 'none'; }, 500);

      // Draw first frame
      resizeCanvas();
      drawSpineFrame(0);
    }

    function resizeCanvas() {
      if (!animBounds) return;
      var container = document.getElementById('canvas-container');
      var cw = container.clientWidth;
      var ch = container.clientHeight;

      // Use device pixel ratio for sharp rendering
      var dpr = window.devicePixelRatio || 1;
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
    }

    window.addEventListener('resize', function() {
      resizeCanvas();
    });

    function setupCanvasTransform() {
      if (!animBounds) return;
      var centerX = animBounds.offset.x + animBounds.size.x / 2;
      var centerY = animBounds.offset.y + animBounds.size.y / 2;
      var scaleX = animBounds.size.x / canvas.width;
      var scaleY = animBounds.size.y / canvas.height;
      var scale = Math.max(scaleX, scaleY) * 1.2;
      var width = canvas.width * scale;
      var height = canvas.height * scale;

      context.setTransform(1, 0, 0, 1, 0, 0);
      context.scale(1 / scale, 1 / scale);
      context.translate(-centerX, -centerY);
      context.translate(width / 2, height / 2);
    }

    function drawSpineFrame(delta) {
      if (!skeleton || !animState) return;

      animState.update(delta);
      animState.apply(skeleton);
      skeleton.updateWorldTransform();

      context.save();
      context.setTransform(1, 0, 0, 1, 0, 0);
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.restore();

      setupCanvasTransform();
      skeletonRenderer.draw(skeleton);
    }

    // ==================== Spine Beat Sync ====================
    var spineAnimId = null;
    var spineStartTime = 0;
    var lastRenderTime = 0;

    function startSpineSync() {
      if (!skeleton) return;
      var ctx = ensureAudioCtx();
      spineStartTime = ctx.currentTime;
      lastRenderTime = ctx.currentTime;

      // Reset animation to beginning
      animState.setAnimation(0, 'animation', true);
      animState.update(0);
      animState.apply(skeleton);

      cancelAnimationFrame(spineAnimId);
      renderSpineFrame();
    }

    function stopSpineSync() {
      if (spineAnimId) {
        cancelAnimationFrame(spineAnimId);
        spineAnimId = null;
      }
      // Draw first frame (idle pose)
      if (skeleton && animState) {
        animState.setAnimation(0, 'animation', true);
        drawSpineFrame(0);
      }
    }

    function renderSpineFrame() {
      if (!isPlaying || !skeleton) return;
      var ctx = ensureAudioCtx();
      var now = ctx.currentTime;
      var realDelta = now - lastRenderTime;
      lastRenderTime = now;

      // Calculate speed ratio: how fast should the animation play
      // to fit SPINE_BEATS_PER_LOOP beats into one animation loop
      var beatInterval = getBeatInterval();
      var targetLoopDuration = SPINE_BEATS_PER_LOOP * beatInterval;
      var speedRatio = SPINE_ANIM_DURATION / targetLoopDuration;

      var adjustedDelta = realDelta * speedRatio;

      drawSpineFrame(adjustedDelta);

      spineAnimId = requestAnimationFrame(renderSpineFrame);
    }

    function resyncSpine() {
      if (!audioCtx || !skeleton) return;
      var beatInterval = getBeatInterval();
      var targetLoopDuration = SPINE_BEATS_PER_LOOP * beatInterval;
      var speedRatio = SPINE_ANIM_DURATION / targetLoopDuration;

      // Calculate where in the beat cycle we are
      var timeUntilNextBeat = nextBeatTime - audioCtx.currentTime;
      var beatsFromStart = (audioCtx.currentTime - spineStartTime) / beatInterval;
      var beatInCycle = Math.round(beatsFromStart) % SPINE_BEATS_PER_LOOP;

      // Target animation time for the next beat hit
      // First hit at ~t=0.1s (beginning of loop), second at ~t=0.5333s (middle)
      var firstHitTime = 0.1;
      var secondHitTime = SPINE_ANIM_DURATION / 2 + 0.1333;
      var targetAnimTime = beatInCycle === 0 ? firstHitTime : secondHitTime;

      // Reset animation to correct phase
      var desiredAnimTime = targetAnimTime - (timeUntilNextBeat * speedRatio);
      // Normalize to [0, SPINE_ANIM_DURATION)
      desiredAnimTime = ((desiredAnimTime % SPINE_ANIM_DURATION) + SPINE_ANIM_DURATION) % SPINE_ANIM_DURATION;

      animState.setAnimation(0, 'animation', true);
      animState.update(0);
      animState.apply(skeleton);
      // Advance to the desired position
      animState.update(desiredAnimTime);
      animState.apply(skeleton);

      spineStartTime = audioCtx.currentTime;
      lastRenderTime = audioCtx.currentTime;
    }
  </script>
</body>
</html>
